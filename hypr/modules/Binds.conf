# Key bindings
$mainMod = SUPER

# Custom binds
bind = $mainMod, ESCAPE, exec, systemctl hibernate
bind = $mainMod, SPACE, exec, apps-launcher
bind = $mainMod, E, exec, kitty
bind = $mainMod, P, exec, grim -g "$(slurp)"

# Window management
bind = $mainMod, Q, killactive
bind = $mainMod, F, fullscreen
bind = $mainMod, C, togglefloating
bind = $mainMod, X, pseudo
bind = $mainMod, R, togglesplit

# Move window position
bind = $mainMod SHIFT, A, movewindow, l
bind = $mainMod SHIFT, D, movewindow, r
bind = $mainMod SHIFT, W, movewindow, u
bind = $mainMod SHIFT, S, movewindow, d

# Move focus
bind = $mainMod, A, movefocus, l
bind = $mainMod, D, movefocus, r
bind = $mainMod, W, movefocus, u
bind = $mainMod, S, movefocus, d

# Resize active window
binde = $mainMod, right, resizeactive, 5 0
binde = $mainMod, left, resizeactive, -5 0
binde = $mainMod, up, resizeactive, 0 -5
binde = $mainMod, down, resizeactive, 0 5

# Move active window precisely
binde = CONTROL, right, moveactive, 50 0
binde = CONTROL, left, moveactive, -50 0
binde = CONTROL, up, moveactive, 0 -50
# binde = CONTROL, down, moveactive, 0 50   # uncomment if desired

# Mouse bindings
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# Multimedia controls
bindel = ,XF86AudioRaiseVolume, exec, ~/.config/hypr/scripts/volume.sh up
bindel = ,XF86AudioLowerVolume, exec, ~/.config/hypr/scripts/volume.sh down
bindel = ,XF86AudioMute, exec, ~/.config/hypr/scripts/volume.sh mute
bindel = ,XF86AudioMicMute, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindel = ,XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/brightness.sh up
bindel = ,XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/brightness.sh down

bindl = , XF86AudioPlay,  exec, mprisctl play-pause
bindl = , XF86AudioPause, exec, mprisctl play-pause
bindl = , XF86AudioNext,  exec, mprisctl next
bindl = , XF86AudioPrev,  exec, mprisctl prev
bindl = , XF86AudioStop,  exec, mprisctl stop

# ───────────────────────────────────────────────────────────────
# StandardOS widget canvas — Super+Return holds the Dashboard.
# ───────────────────────────────────────────────────────────────
# `bind` fires on key press, `bindr` on release. Holding the chord
# keeps the canvas open between the two events. The eww daemon
# (services.standardosCanvas) must be running for these to do
# anything; the service is graphical-session-bound, so by the time
# the user can press a keybind the daemon is up.
#
# These keybinds are NOT advertised. Per the spec, widgets sit above
# pillar 6's mouse floor — mouse users have no path to the canvas,
# the keyboard is the only door.
bind  = $mainMod, RETURN, exec, eww open dashboard
bindr = $mainMod, RETURN, exec, eww close dashboard

# Workspace switching
bind = $mainMod, 1, exec, ~/.config/hypr/scripts/1.sh
bind = $mainMod, 2, exec, ~/.config/hypr/scripts/2.sh
bind = $mainMod, 3, exec, ~/.config/hypr/scripts/3.sh
bind = $mainMod, 4, exec, ~/.config/hypr/scripts/4.sh
bind = $mainMod, 5, exec, ~/.config/hypr/scripts/5.sh
bind = $mainMod, 6, exec, ~/.config/hypr/scripts/6.sh
bind = $mainMod, 7, exec, ~/.config/hypr/scripts/7.sh
bind = $mainMod, 8, exec, ~/.config/hypr/scripts/8.sh
bind = $mainMod, 9, exec, ~/.config/hypr/scripts/9.sh

# Move workspace to other monitor
bind = $mainMod, TAB, focusmonitor, +1
bind = $mainMod SHIFT, TAB, exec, ~/.config/hypr/scripts/10.sh

# Move window to workspace
bind = $mainMod SHIFT, 1, exec, ~/.config/hypr/scripts/11.sh
bind = $mainMod SHIFT, 2, exec, ~/.config/hypr/scripts/12.sh
bind = $mainMod SHIFT, 3, exec, ~/.config/hypr/scripts/13.sh
bind = $mainMod SHIFT, 4, exec, ~/.config/hypr/scripts/14.sh
bind = $mainMod SHIFT, 5, exec, ~/.config/hypr/scripts/15.sh
bind = $mainMod SHIFT, 6, exec, ~/.config/hypr/scripts/16.sh
bind = $mainMod SHIFT, 7, exec, ~/.config/hypr/scripts/17.sh
bind = $mainMod SHIFT, 8, exec, ~/.config/hypr/scripts/18.sh
bind = $mainMod SHIFT, 9, exec, ~/.config/hypr/scripts/19.sh

# Nautilus file manager
bind = $mainMod, N, exec, nautilus --new-window
