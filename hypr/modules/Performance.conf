# Performance tweaks (miscellaneous section)
misc {
    force_default_wallpaper = 0
    disable_hyprland_logo = true
    render_unfocused_fps = 0
    animate_manual_resizes = false
    animate_mouse_windowdragging = false
    # hyprland-guiutils is not in nixpkgs and we don't use it; mute the
    # "not installed" CHyprError that performUserChecks() emits on every
    # config reload (incl. autoreload from nixos-rebuild switch symlink churn).
    disable_hyprland_guiutils_check = true
}
