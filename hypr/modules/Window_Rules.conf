# Window and layer rules

# Rofi behaviour
windowrulev2 = nofocus, class:^(Rofi)$
windowrulev2 = stayfocused, class:^(Rofi)$

# Layer shells transparency
layerrule = blur, waybar
layerrule = ignorealpha 0.3, waybar
layerrule = blur, rofi
layerrule = ignorealpha 0.3, rofi
# Eww layer-shell windows (the StandardOS canvas) -- namespace is
# "gtk-layer-shell" (the GTK layer-shell library default), not the
# eww window name. Confirmed via `hyprctl -j layers` while canvas open.
layerrule = blur, gtk-layer-shell
layerrule = ignorealpha 0.3, gtk-layer-shell

# Global rules
windowrule = suppressevent maximize, class:.*
windowrule = nofocus,class:^$,title:^$,xwayland:1,floating:1,fullscreen:0,pinned:0

# Optional: opacity for kitty (uncomment to enable)
# windowrulev2 = opacity 0.9 0.8,class:^(kitty)$
