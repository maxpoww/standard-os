# Visual appearance: layout, gaps, borders, opacity, decorations

general {
    gaps_in = 3
    gaps_out = 2 ,6 ,6 ,6
    border_size = 1
    col.active_border = rgba(33ccffee) rgba(00ff99ee) 45deg
    col.inactive_border = rgba(595959aa)
    resize_on_border = true
    extend_border_grab_area = 15
    allow_tearing = false
    layout = dwindle
}

decoration {
    rounding = 10
    rounding_power = 2
    dim_inactive = false
 #   dim_strength = 1.0
  #  active_opacity = 1.0
   # inactive_opacity = 1.0

    shadow {
        enabled = false
        range = 4
        render_power = 3
        color = rgba(1a1a1aee)
    }

    blur {
        enabled = true
        # Bumped from defaults so the canvas (eww gtk-layer-shell)
        # gets a real frosted-glass effect. Affects every layer with
        # `layerrule = blur, ...` -- waybar / rofi / canvas.
        size = 12
        passes = 3
        vibrancy = 0.1696
    }
}

dwindle {
    pseudotile = true
    preserve_split = true
    force_split = 2
}

master {
    new_status = master
}
